<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blocked</title>
  <link rel="stylesheet" href="blocked.css">
</head>
<body>
  <div class="card">
    <div class="icon">&#x1f6ab;</div>
    <h1>Site Blocked</h1>
    <p id="domain-msg">This site is currently blocked.</p>
    <p id="timer" class="timer"></p>
  </div>
  <script>
    const params = new URLSearchParams(window.location.search);
    const domain = params.get("domain");
    if (domain) {
      document.getElementById("domain-msg").textContent =
        domain + " is currently blocked.";
    }

    // Show remaining time
    chrome.storage.local.get(["endTime"], (data) => {
      if (!data.endTime) return;
      const timerEl = document.getElementById("timer");

      function tick() {
        const remaining = Math.max(0, data.endTime - Date.now());
        if (remaining <= 0) {
          timerEl.textContent = "Blocking has ended. Refresh to continue.";
          return;
        }
        const mins = Math.floor(remaining / 60000);
        const secs = Math.floor((remaining % 60000) / 1000);
        timerEl.textContent =
          String(mins).padStart(2, "0") + ":" + String(secs).padStart(2, "0") + " remaining";
        setTimeout(tick, 1000);
      }
      tick();
    });
  </script>
</body>
</html>
